title: Synthetic Inline osascript from an Interactive Parent
id: 10000000-0000-4000-8000-000000000008
status: test
description: Synthetic macOS process-creation benchmark rule.
author: SigmaMutant contributors
date: 2026-08-24
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith:
      - '/osascript'
      - '/osascript.bin'
    CommandLine|contains:
      - ' -e '
      - 'JavaScript'
    ParentImage|endswith:
      - '/Terminal'
      - '/zsh'
  filter_management:
    SigningId|startswith: 'com.example.approved-management.'
  condition: selection and not filter_management
falsepositives:
  - Synthetic benchmark only
level: medium
