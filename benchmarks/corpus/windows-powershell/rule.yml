title: Synthetic Encoded PowerShell from an Untrusted Parent
id: 10000000-0000-4000-8000-000000000001
status: test
description: Synthetic benchmark rule; no production telemetry is included.
author: SigmaMutant contributors
date: 2026-08-24
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -enc '
  filter_parent:
    ParentImage|endswith: '\approved-deployer.exe'
  condition: selection and not filter_parent
falsepositives:
  - Synthetic benchmark only
level: high
