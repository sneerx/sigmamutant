[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sigmamutant"
version = "1.0.0"
description = "Mutation testing for Sigma detection rules and their labelled event fixtures"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "SigmaMutant contributors" },
]
keywords = ["sigma", "security", "detection-engineering", "mutation-testing", "blue-team"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "azuma==0.7.3",
  "pysigma>=1.4.0,<2",
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "ruamel.yaml>=0.18.6,<0.19",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ai = [
  "openai>=2.47,<3",
]
dev = [
  "coverage[toml]>=7.6",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.8,<1",
]

[project.scripts]
sigmamutant = "sigmamutant.cli:app"

[project.urls]
Homepage = "https://github.com/sneerx/sigmamutant"
Repository = "https://github.com/sneerx/sigmamutant"
Documentation = "https://github.com/sneerx/sigmamutant/tree/main/docs"
Issues = "https://github.com/sneerx/sigmamutant/issues"
Changelog = "https://github.com/sneerx/sigmamutant/blob/main/CHANGELOG.md"

[tool.hatch.build]
exclude = [
  "/.coverage",
  "/.coverage.*",
  "/.cache",
  "/.DS_Store",
  "/.env*",
  "/.mypy_cache",
  "/.nox",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.tox",
  "/.venv",
  "/artifacts",
  "/build",
  "/coverage.xml",
  "/dist",
  "/htmlcov",
  "**/.coverage*",
  "**/.cache",
  "**/.env*",
  "**/.mypy_cache",
  "**/.nox",
  "**/.pytest_cache",
  "**/.ruff_cache",
  "**/.tox",
  "**/.venv",
  "**/__pycache__",
  "**/artifacts",
  "**/build",
  "**/coverage.xml",
  "**/dist",
  "**/htmlcov",
  "**/*.egg-info",
  "**/*.py[cod]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sigmamutant"]

[tool.hatch.build.targets.wheel.force-include]
"examples/rules/powershell_encoded.yml" = "sigmamutant/_example_data/rules/powershell_encoded.yml"
"examples/fixtures/weak.jsonl" = "sigmamutant/_example_data/fixtures/weak.jsonl"
"examples/fixtures/strong.jsonl" = "sigmamutant/_example_data/fixtures/strong.jsonl"
"examples/weak-suite.yml" = "sigmamutant/_example_data/weak-suite.yml"
"examples/strong-suite.yml" = "sigmamutant/_example_data/strong-suite.yml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["sigmamutant"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
